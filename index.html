#heroTxt{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 24px calc(40px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none}
#heroTxt img{width:min(62vw,340px);height:auto}
#heroTxt p{font:400 clamp(9px,2.4vw,12px) var(--id);letter-spacing:.28em;color:var(--steel);margin:16px 0 0}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
header img{height:30px;width:auto}
.cta{color:var(--white);font:600 13px var(--ui);letter-spacing:.18em;padding:10px 0;text-decoration:none}.cta:hover{color:var(--cyan)}
.cta:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:1px solid var(--cyan);outline-offset:3px}
#info{position:fixed;left:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:4;width:100%;max-width:460px;padding:0 20px;pointer-events:none}
.card{background:rgba(6,7,10,.84);border:1px solid var(--border);padding:18px;backdrop-filter:blur(6px);animation:in .5s ease both;pointer-events:auto}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.k{font:600 10px var(--ui);letter-spacing:.2em;color:var(--cyan);margin:0 0 10px}
h2{font:400 clamp(15px,4.4vw,20px)/1.3 var(--id);margin:0 0 10px;letter-spacing:.04em}
.card img{height:34px;width:auto;max-width:70%;display:block;margin:0 0 12px}
.card p{margin:0 0 12px;font-size:14px;line-height:1.5;color:var(--steel)}
.card p.k{margin:0 0 10px;color:var(--cyan)}
.btn{display:inline-block;border:1px solid var(--cyan);color:var(--white);padding:9px 14px;font:600 12px var(--ui);letter-spacing:.1em;text-decoration:none;border-radius:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;gap:8px;overflow-x:auto;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
nav button{flex:none;background:rgba(6,7,10,.84);border:1px solid var(--border);color:var(--steel);font:600 10px var(--ui);letter-spacing:.14em;padding:9px 12px;border-radius:2px;cursor:pointer}

w.y=Math.sin(i*1.7)*1.4;const pts=[];for(let k=0;k<=96;k++){const a=k/96*Math.PI*2;pts.push(V(Math.cos(a)*RAD(i),w.y,Math.sin(a)*RAD(i)))}
w.o=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:w.c,transparent:true,opacity:.05}));S.add(w.o)});
const wp=(i,t)=>{const a=i*Math.PI/3+(RM?0:t*(.05-i*.004));return V(Math.cos(a)*RAD(i),W[i].y,Math.sin(a)*RAD(i))};
// Conexiones transversales: HUB y ORBIT atraviesan los demás mundos
const cp=new Float32Array(60),cg=new THREE.BufferGeometry();cg.setAttribute('position',new THREE.BufferAttribute(cp,3));
const cl=new THREE.LineSegments(cg,new THREE.LineBasicMaterial({color:0x25d9fd,transparent:true,opacity:0}));S.add(cl);
const Cc=V(0,11,31),O=V(0,0,0);
const D=MOB?19:16,LY=MOB?-4.1:-4.2;
const FA=(k,n,s)=>{const a=Math.atan2(WG[k].position.z,WG[k].position.x),b=Math.atan2(WG[n].position.z,WG[n].position.x);let d=b-a;d-=Math.round(d/(2*Math.PI))*2*Math.PI;const c=a+d*s;return V(Math.cos(c)*D,1.5,Math.sin(c)*D)};
const F=k=>FA(k,k,0),LK=k=>V(0,MOB?-4.6:-3.2,0);
function plan(p){let P,Lk=O.clone(),act=-1,fw=[1,1,1,1,1,1];
if(p<.15)P=V(0,0,12).lerp(V(0,2.5,17),ss(0,.15,p));
else if(p<.30)P=V(0,2.5,17).lerp(Cc,ss(.15,.30,p));
else if(p<.34){const s=ss(.30,.34,p);P=Cc.clone().lerp(F(0),s);Lk=O.clone().lerp(LK(0),s);fw=fw.map((_,j)=>j?1-s:1)}
else if(p<.90){const t=(p-.34)/.56*6,k=Math.min(5,Math.floor(t)),f=t-k,s=k<5?ss(.55,1,f):0,n=Math.min(5,k+1);
P=FA(k,n,s);Lk=LK(k).lerp(LK(n),s);act=(f>.78&&k<5)?k+1:k;fw=fw.map((_,j)=>j==k?1-s:j==n?s:0)}
else{const s=ss(.9,.97,p);P=F(5).lerp(Cc,s);Lk=LK(5).lerp(O,s);act=s>.5?-2:5;fw=fw.map((_,j)=>j==5?1:s)}
return{P,Lk,act,fw}}
function html(p,act){
if(p<.06)return['',''];
if(p<.15)return['c1','<p class="k">ESCENA 01 · THE CORE</p><h2>369 Holdings</h2><p>Diseñamos arquitecturas corporativas independientes que operan con precisión y se conectan para generar sinergias exponenciales.</p>'];
if(p<.34)return['c2','<p class="k">ESCENA 02 · THE EXPANSION</p><h2>Seis mundos. Un solo núcleo.</h2><p>Seis unidades especializadas, seis enfoques estratégicos.</p>'];
if(act>=0){const w=W[act];return['w'+act,'<p class="k">BUSINESS WORLD 0'+(act+1)+'</p>'+'<h2>'+w.t+'</h2><p>'+w.d+'</p><a class="btn" href="'+w.url+'">EXPLORAR MUNDO →</a>']}
return['end','<p class="k">ESCENA 06 · ENTER THE WORLD</p><h2>Entra al universo</h2><p>El futuro de los negocios exige integración sin fricciones e independencia con propósito.</p>']}
const H=document.documentElement,info=document.getElementById('info'),nav=document.getElementById('nav'),hero=document.getElementById('hero'),ht=document.getElementById('heroTxt');
const go=p=>scrollTo({top:p*(H.scrollHeight-innerHeight),behavior:RM?'auto':'smooth'});
const pk=i=>.34+i*.56/6+.02;
const items=[{l:'UNIVERSO',p:.30}].concat(W.map((w,i)=>({l:w.s,p:pk(i)})));
items.forEach(it=>{const b=document.createElement('button');b.textContent=it.l;b.onclick=()=>go(it.p);nav.appendChild(b);it.b=b});
const ray=new THREE.Raycaster();
cv.addEventListener('click',e=>{ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},C);
const h=ray.intersectObjects(WG.filter(g=>g.visible),true)[0];if(!h)return;const i=WG.findIndex(g=>{let o=h.object;while(o){if(o===g)return true;o=o.parent}return false});if(i>=0){if(i===curAct&&W[i].url!=='#')location.href=W[i].url;else go(pk(i))}});
const res=()=>{R.setSize(innerWidth,innerHeight,false);PM.uniforms.sc.value=R.getDrawingBufferSize(new THREE.Vector2()).y*.5;C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()};addEventListener('resize',res);res();
let curAct=-1,FW=[1,1,1,1,1,1],key='x',cur=V(0,0,12),lk=V(0,0,0);const t0=performance.now();
function loop(now){const t=(now-t0)/1000,p=Math.min(1,scrollY/Math.max(1,H.scrollHeight-innerHeight));
const dock=ss(.31,.35,p)*(1-ss(.90,.95,p));
W.forEach((w,i)=>{const g=WG[i],u=g.userData,m=g.material,s=Math.max(.001,ss(.15+i*.02,.27+i*.01,p));g.position.copy(wp(i,t).lerp(V(0,LY,0),dock));const W2=(u.w||1)*(1+.5*dock);g.scale.set(s*W2,s*(u.w?W2/u.a:1),1);m.opacity+=(FW[i]-m.opacity)*(RM?1:.12);g.visible=s>.01&&!!u.w&&m.opacity>.03;w.o.material.opacity=(.05+.25*s)*(.25+.75*m.opacity)});
let n=0;for(const h of[1,3])for(let j=0;j<6;j++)if(j!=h){const a=WG[h].position,b=WG[j].position;cp.set([a.x,a.y,a.z,b.x,b.y,b.z],n);n+=6}
cg.attributes.position.needsUpdate=true;cl.material.opacity=.4*ss(.2,.3,p)*(.25+.75*Math.min(...FW));
const{P,Lk,act,fw}=plan(p),f=RM?1:.07;FW=fw;curAct=act;cur.lerp(P,f);lk.lerp(Lk,f);C.position.copy(cur);C.lookAt(lk);cy.position.copy(cur);animCore(t);

hero.style.opacity=1-ss(0,.1,p);ht.style.opacity=1-ss(0,.05,p);nav.style.display=p>.28?'flex':'none';
const[k,h]=html(p,act);if(k!==key){key=k;info.innerHTML=h?'<div class="card">'+h+'</div>':'';items.forEach((it,i)=>it.b.classList.toggle('on',i?act===i-1:act<0))}
R.render(S,C);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
