#heroTxt{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:0 24px calc(40px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none}
#heroTxt img{width:min(62vw,340px);height:auto}
#heroTxt p{font:400 clamp(9px,2.4vw,12px) var(--id);letter-spacing:.28em;color:var(--steel);margin:16px 0 0}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
header img{height:30px;width:auto}
.cta{color:var(--white);font:600 13px var(--ui);letter-spacing:.18em;padding:10px 0;text-decoration:none}.cta:hover{color:var(--cyan)}
.cta:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:1px solid var(--cyan);outline-offset:3px}
#info{position:fixed;left:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:4;width:100%;max-width:460px;padding:0 20px;pointer-events:none}
.card{background:rgba(6,7,10,.84);border:1px solid var(--border);padding:18px;backdrop-filter:blur(6px);animation:in .5s ease both;pointer-events:auto}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.k{font:600 10px var(--ui);letter-spacing:.2em;color:var(--cyan);margin:0 0 10px}
h2{font:400 clamp(15px,4.4vw,20px)/1.3 var(--id);margin:0 0 10px;letter-spacing:.04em}
.card img{height:34px;width:auto;max-width:70%;display:block;margin:0 0 12px}
.card p{margin:0 0 12px;font-size:14px;line-height:1.5;color:var(--steel)}
.card p.k{margin:0 0 10px;color:var(--cyan)}
.btn{display:inline-block;border:1px solid var(--cyan);color:var(--white);padding:9px 14px;font:600 12px var(--ui);letter-spacing:.1em;text-decoration:none;border-radius:2px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:none;gap:8px;overflow-x:auto;padding:10px 20px calc(12px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
nav button{flex:none;background:rgba(6,7,10,.84);border:1px solid var(--border);color:var(--steel);font:600 10px var(--ui);letter-spacing:.14em;padding:9px 12px;border-radius:2px;cursor:pointer}
nav button.on{border-color:var(--cyan);color:var(--white)}
nav button.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-right:8px}
@media(max-width:700px){#info{bottom:calc(58px + env(safe-area-inset-bottom,0px))}.card{padding:14px}.card p{font-size:13px;margin:0 0 10px}h2{font-size:14px;margin:0 0 8px}}
#close{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:4;padding:0 clamp(20px,6vw,72px);pointer-events:none}
#close.on{pointer-events:auto}
#close .it{opacity:0;transform:translateY(14px);transition:opacity .8s ease,transform .8s ease}
#close.on .it{opacity:1;transform:none}
#close .k2{font:600 10px var(--ui);letter-spacing:.3em;color:var(--cyan);margin:0 0 12px}
#close h3{font:700 clamp(20px,3.4vw,38px)/1.2 var(--ui);margin:0 0 24px;max-width:26ch;color:var(--white)}
#close{--k:clamp(34px,4.4vw,60px)}
#close .row{border-top:1px solid var(--border);padding-top:20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px 24px}
#close .row a{display:block;flex:none}
#close .row img{display:block;height:auto;max-width:none}
@media(max-width:700px){#close{--k:9vw}#close .row{justify-content:center}#close h3{margin-bottom:16px}}
